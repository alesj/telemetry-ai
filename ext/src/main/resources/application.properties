# Http
quarkus.http.port=8083

# Logging
quarkus.otel.logs.enabled=true

quarkus.http.access-log.enabled=true
quarkus.http.access-log.exclude-pattern='^/q/.*'
quarkus.http.access-log.pattern='%h %l %u "%r" %s %b "%{i,Referer}" "%{i,User-Agent}" "%{i,Content-type}"'

# Metrics
quarkus.micrometer.export.json.enabled = true
quarkus.micrometer.export.json.path = metrics-alt/json

quarkus.otel.metric.export.interval=15s

# LGTM - latest image, with MCP
# quarkus.observability.lgtm.image-name=docker.io/grafana/otel-lgtm

# Dev MCP
quarkus.dev-mcp.enabled=true

# LGTM manual connection (docker run -p 3000:3000 -p 4317:4317 -p 4318:4318 -p 3200:3200 grafana/otel-lgtm:0.24.0)
%lgtm.quarkus.observability.enabled=false
%lgtm.quarkus.otel.exporter.otlp.endpoint=http://localhost:4318
%lgtm.quarkus.otel.exporter.otlp.protocol=http/protobuf

# Weather API (Open-Meteo, free, no API key needed)
quarkus.rest-client.weather-api.url=${weather-api.url:https://api.open-meteo.com}
quarkus.rest-client.weather-api.connect-timeout=5000
quarkus.rest-client.weather-api.read-timeout=10000

# Datasource (DevServices auto-starts MySQL container in dev/test mode)
quarkus.datasource.db-kind=mysql
quarkus.datasource.jdbc.telemetry=true

# Hibernate
quarkus.hibernate-orm.schema-management.strategy=drop-and-create
