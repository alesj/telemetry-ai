name: Integration Tests

on:
  # schedule:
  #   - cron: '0 3 * * 1-5'
  workflow_dispatch:
    inputs:
      test-type:
        description: 'Test type'
        required: true
        default: 'chaos'
        type: choice
        options:
          - chaos
          - db
          - weather
          - all
      ai-profile:
        description: 'AI provider profile'
        required: true
        default: 'openai'
        type: choice
        options:
          - openai
          - grok
      scorer:
        description: 'Scorer provider'
        required: true
        default: 'openai'
        type: choice
        options:
          - openai
          - grok

jobs:
  chaos-tests:
    if: >-
      inputs.test-type == 'chaos' ||
      inputs.test-type == 'all'
    runs-on: ubuntu-latest
    name: Chaos Integration Tests
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - ai: openai
            scorer: grok
          - ai: grok
            scorer: openai
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run chaos tests (AI=${{ matrix.ai }}, Scorer=${{ matrix.scorer }})
        run: ./run-integration-test.sh chaos ${{ matrix.ai }} ${{ matrix.scorer }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: chaos-reports-${{ matrix.ai }}-${{ matrix.scorer }}
          path: '**/target/surefire-reports/'
          retention-days: 14

  db-tests:
    if: >-
      inputs.test-type == 'db' ||
      inputs.test-type == 'all'
    runs-on: ubuntu-latest
    name: DB Integration Tests
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - ai: openai
            scorer: grok
          - ai: grok
            scorer: openai
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run db tests (AI=${{ matrix.ai }}, Scorer=${{ matrix.scorer }})
        run: ./run-integration-test.sh db ${{ matrix.ai }} ${{ matrix.scorer }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: db-reports-${{ matrix.ai }}-${{ matrix.scorer }}
          path: '**/target/surefire-reports/'
          retention-days: 14

  weather-tests:
    if: >-
      inputs.test-type == 'weather' ||
      inputs.test-type == 'all'
    runs-on: ubuntu-latest
    name: Weather Integration Tests
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - ai: openai
            scorer: grok
          - ai: grok
            scorer: openai
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Run weather tests (AI=${{ matrix.ai }}, Scorer=${{ matrix.scorer }})
        run: ./run-integration-test.sh weather ${{ matrix.ai }} ${{ matrix.scorer }}

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: weather-reports-${{ matrix.ai }}-${{ matrix.scorer }}
          path: '**/target/surefire-reports/'
          retention-days: 14
