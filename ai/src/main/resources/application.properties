# AI

# OpenAI
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY}
quarkus.langchain4j.openai.chat-model.model-name=gpt-4o-mini
quarkus.langchain4j.openai.chat-model.log-requests=false
quarkus.langchain4j.openai.chat-model.log-responses=false
quarkus.langchain4j.openai.timeout=120s

# Claude
quarkus.langchain4j.anthropic.api-key=${ANTHROPIC_API_KEY}

# Gemini
quarkus.langchain4j.ai.gemini.api-key=${GEMINI_API_KEY}
quarkus.langchain4j.ai.gemini.log-requests=true
quarkus.langchain4j.ai.gemini.log-responses=true
quarkus.langchain4j.ai.gemini.timeout=120s
quarkus.langchain4j.ai.gemini.chat-model.log-requests=true
quarkus.langchain4j.ai.gemini.chat-model.log-responses=true

# Watson
quarkus.langchain4j.watsonx.base-url=${WATSONX_BASE_URL}
quarkus.langchain4j.watsonx.api-key=${WATSONX_API_KEY}
quarkus.langchain4j.watsonx.project-id=${WATSONX_PROJECT_ID}

quarkus.langchain4j.watsonx.mode=chat

quarkus.langchain4j.watsonx.chat-model.model-name=ibm/granite-4-h-small

quarkus.langchain4j.watsonx.chat-model.max-output-tokens=0
quarkus.langchain4j.watsonx.chat-model.temperature=0.2

#---

# Chat memory - increase window for multi-step tool execution
quarkus.langchain4j.chat-memory.memory-window.max-messages=50

# Logging
quarkus.log.category."dev.langchain4j".level=WARN
quarkus.log.category."io.quarkiverse.langchain4j".level=WARN

