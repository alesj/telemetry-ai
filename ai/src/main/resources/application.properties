# Chat memory - increase window for multi-step tool execution
quarkus.langchain4j.chat-memory.memory-window.max-messages=50

# Logging
quarkus.log.category."dev.langchain4j".level=WARN
quarkus.log.category."io.quarkiverse.langchain4j".level=WARN

